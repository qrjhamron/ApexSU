name: ApexSU CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ANDROID_HOME: /usr/local/lib/android/sdk
  NDK_VERSION: 29.0.13846066
  ANDROID_API_LEVEL: "26"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: manager
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: >-
            platform-tools
            ndk;29.0.13846066

      - name: Cache Gradle
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('manager/gradle/wrapper/gradle-wrapper.properties', 'manager/gradle/libs.versions.toml', 'manager/**/*.gradle.kts', 'manager/**/gradle.lockfile', 'manager/**/*.lockfile') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manager-lint-report
          path: |
            manager/app/build/reports/lint-results-debug.html
            manager/app/build/reports/lint-results-debug.xml
            manager/app/build/reports/lint/
          if-no-files-found: warn

  build-manager:
    name: build-manager
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - lint
    defaults:
      run:
        working-directory: manager
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: >-
            platform-tools
            build-tools;36.0.0
            ndk;29.0.13846066

      - name: Cache Gradle + NDK
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            /usr/local/lib/android/sdk/ndk/29.0.13846066
          key: ${{ runner.os }}-manager-${{ env.NDK_VERSION }}-${{ hashFiles('manager/gradle/wrapper/gradle-wrapper.properties', 'manager/gradle/libs.versions.toml', 'manager/**/*.gradle.kts', 'manager/**/gradle.lockfile', 'manager/**/*.lockfile') }}
          restore-keys: |
            ${{ runner.os }}-manager-${{ env.NDK_VERSION }}-
            ${{ runner.os }}-manager-

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manager-debug-apk
          path: manager/app/build/outputs/apk/debug/
          if-no-files-found: error

      - name: Assemble release APK (unsigned)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manager-release-unsigned-apk
          path: |
            manager/app/build/outputs/apk/release/*unsigned*.apk
            manager/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  build-ksud:
    name: build-ksud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: >-
            platform-tools
            ndk;29.0.13846066

      - name: Setup Rust toolchain (stable + target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android

      - name: Cache cargo registry + target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            userspace/ksud/target
          key: ${{ runner.os }}-ksud-cargo-${{ hashFiles('userspace/ksud/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ksud-cargo-

      - name: Configure Android linker env
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          LLVM_BIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$LLVM_BIN/aarch64-linux-android${ANDROID_API_LEVEL}-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$LLVM_BIN/aarch64-linux-android${ANDROID_API_LEVEL}-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$LLVM_BIN/aarch64-linux-android${ANDROID_API_LEVEL}-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$LLVM_BIN/llvm-ar" >> "$GITHUB_ENV"

      - name: Build ksud (aarch64-linux-android release)
        run: cargo build --release --manifest-path userspace/ksud/Cargo.toml --target aarch64-linux-android

      - name: Run ksud native tests
        run: cargo test --manifest-path userspace/ksud/Cargo.toml --locked

      - name: Upload ksud artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ksud-aarch64-linux-android
          path: userspace/ksud/target/aarch64-linux-android/release/ksud
          if-no-files-found: error

  build-ksuinit:
    name: build-ksuinit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: >-
            platform-tools
            ndk;29.0.13846066

      - name: Setup Rust toolchain (stable + target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android

      - name: Cache cargo registry + target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            userspace/ksuinit/target
          key: ${{ runner.os }}-ksuinit-cargo-${{ hashFiles('userspace/ksuinit/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ksuinit-cargo-

      - name: Configure Android linker env
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          LLVM_BIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$LLVM_BIN/aarch64-linux-android${ANDROID_API_LEVEL}-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$LLVM_BIN/aarch64-linux-android${ANDROID_API_LEVEL}-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$LLVM_BIN/aarch64-linux-android${ANDROID_API_LEVEL}-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$LLVM_BIN/llvm-ar" >> "$GITHUB_ENV"

      - name: Build ksuinit (aarch64-linux-android release)
        run: cargo build --release --manifest-path userspace/ksuinit/Cargo.toml --target aarch64-linux-android

      - name: Run ksuinit native tests
        run: cargo test --manifest-path userspace/ksuinit/Cargo.toml --locked

      - name: Upload ksuinit artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ksuinit-aarch64-linux-android
          path: userspace/ksuinit/target/aarch64-linux-android/release/ksuinit
          if-no-files-found: error

  kernel-check:
    name: kernel-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make bc libssl-dev libelf-dev python3 curl xz-utils gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Prepare reference kernel headers (compile-check only)
        id: prep-headers
        run: |
          set -e
          KVER="6.1.96"
          TAR="linux-${KVER}.tar.xz"
          URL="https://cdn.kernel.org/pub/linux/kernel/v6.x/${TAR}"
          KERNEL_SRC="$RUNNER_TEMP/linux-${KVER}"
          echo "KERNEL_SRC=$KERNEL_SRC" >> "$GITHUB_ENV"

          if ! curl -fsSL "$URL" -o "$RUNNER_TEMP/$TAR"; then
            echo "::warning::Unable to download kernel source (${URL}); skipping kernel compile-check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tar -xf "$RUNNER_TEMP/$TAR" -C "$RUNNER_TEMP"
          make -C "$KERNEL_SRC" ARCH=arm64 defconfig
          make -C "$KERNEL_SRC" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Build kernel module (compile check only, not boot test)
        if: steps.prep-headers.outputs.skip != 'true'
        run: |
          set -o pipefail
          make -C "$KERNEL_SRC" M="$GITHUB_WORKSPACE/kernel" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules 2>&1 | tee kernel-build.log
          echo "Kernel job is compile-check only; no boot/runtime validation is performed."

      - name: Mark kernel check skipped
        if: steps.prep-headers.outputs.skip == 'true'
        run: echo "Kernel compile-check skipped due to missing reference headers/source."

      - name: Upload kernel build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-check-log
          path: kernel-build.log
          if-no-files-found: warn
