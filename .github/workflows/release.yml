name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release-readiness:
    needs:
      - build-manager
    uses: ./.github/workflows/release-readiness.yml
    secrets: inherit
  release:
    needs:
      - build-manager
      - release-readiness
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7

      - name: Rename ksud
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
              if [ -d "$dir" ]; then
                 echo "----- Rename $dir -----"
                 ksud_platform_name=$(basename "$dir")
                 find "$dir" -type f -name "ksud" -path "*/release/*" | while read -r ksud_file; do
                   if [ -f "$ksud_file" ]; then
                     mv "$ksud_file" "ksud/$ksud_platform_name"
                   fi
                 done
              fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: Generate SHA256SUMS
        run: |
          find manager android*-lkm ksud ksuinit -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          test -s SHA256SUMS || { echo "SHA256SUMS generation failed"; exit 1; }

      - name: Generate lightweight SBOM
        run: |
          {
            echo "{"
            echo "  \"name\": \"ApexSU release artifacts\","
            echo "  \"version\": \"${GITHUB_REF_NAME}\","
            echo "  \"artifacts\": ["
            find manager android*-lkm ksud ksuinit -type f | sed 's/.*/    {\"path\":\"&\"},/'
            echo "    {\"path\":\"SHA256SUMS\"}"
            echo "  ]"
            echo "}"
          } > RELEASE_SBOM.json
          test -s RELEASE_SBOM.json || { echo "SBOM generation failed"; exit 1; }

      - name: Attest release checksums
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: SHA256SUMS

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            manager/*.apk
            android*-lkm/*_kernelsu.ko
            ksud/ksud-*
            ksuinit/**
            SHA256SUMS
            RELEASE_SBOM.json
